name: Daily Ship Scrape

on:
  schedule:
    - cron: "0 1,7 * * *" # KST 기준 오전 10시 (UTC 1시), 오후 4시 (UTC 7시)
  workflow_dispatch: # 이 줄이 있어야 Actions 탭에 수동 실행 버튼이 생깁니다.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Check Japan business day
        id: jpday
        run: |
          pip install jpholiday
          python scripts/jp_business_day.py

      - name: Install dependencies
        if: steps.jpday.outputs.should_run == 'true'
        run: |
          pip install -r requirements.txt

      - name: Run Scraper
        if: steps.jpday.outputs.should_run == 'true'
        run: python scraper.py

      - name: Commit and Push
        if: steps.jpday.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update shipping data" && git push)
